<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img"><title>同一个需求：为已有网站增加投稿与评审</title><rect width="1500" height="560" fill="#fff" /><text x="44" y="62" fill="#18394a" font-size="32" font-weight="600" font-family="Arial, PingFang SC, sans-serif">同一个需求：为已有网站增加投稿与评审</text><text x="44" y="99" fill="#526b75" font-size="17" font-weight="400" font-family="Arial, PingFang SC, sans-serif">ADPS  /  设计示例</text><rect x="44.0" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="44.0" y="140" width="264.8" height="5" fill="#247d7c" /><text x="62.0" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">自己编写</text><text x="62.0" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">复用网站 Repo</text><text x="62.0" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">增加侧栏与接口</text><text x="62.0" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">自己维护业务规则</text><rect x="330.8" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="330.8" y="140" width="264.8" height="5" fill="#a47d29" /><text x="348.8" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">AI 生成平台</text><text x="348.8" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">生成表单和管理页</text><text x="348.8" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">核对数据与身份</text><text x="348.8" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">验证部署方式</text><rect x="617.6" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="617.6" y="140" width="264.8" height="5" fill="#247d7c" /><text x="635.6" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">低代码工具</text><text x="635.6" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">表单收件与表格审核</text><text x="635.6" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">分开待审与公开记录</text><text x="635.6" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">关联原文段落</text><rect x="904.4000000000001" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="904.4000000000001" y="140" width="264.8" height="5" fill="#a47d29" /><text x="922.4000000000001" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">工作平台扩展</text><text x="922.4000000000001" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">复用团队数据</text><text x="922.4000000000001" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">增加外部读者入口</text><text x="922.4000000000001" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">隔离内部资料</text><rect x="1191.2" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="1191.2" y="140" width="264.8" height="5" fill="#247d7c" /><text x="1209.2" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">专用产品</text><text x="1209.2" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">使用已有评论与修订</text><text x="1209.2" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">检查审核粒度</text><text x="1209.2" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">验证导出与定位</text><text x="44" y="494" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">共同要处理：原文版本、投稿身份、公开许可，以及正文修改的审批。</text><text x="44" y="524" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">五种选择可以组合，差别不只是界面如何生成。</text></svg>