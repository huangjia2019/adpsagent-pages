<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img"><title>公开讨论与修改正文：两条审批路径</title><rect width="1500" height="560" fill="#fff" /><text x="44" y="62" fill="#18394a" font-size="32" font-weight="600" font-family="Arial, PingFang SC, sans-serif">公开讨论与修改正文：两条审批路径</text><text x="44" y="99" fill="#526b75" font-size="17" font-weight="400" font-family="Arial, PingFang SC, sans-serif">ADPS  /  设计示例</text><rect x="44.0" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="44.0" y="140" width="264.8" height="5" fill="#247d7c" /><text x="62.0" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">引用原文</text><text x="62.0" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">固定段落与版本</text><text x="62.0" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">保存选中的引用</text><text x="62.0" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">原文改动后可追溯</text><rect x="330.8" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="330.8" y="140" width="264.8" height="5" fill="#a47d29" /><text x="348.8" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">提交意见</text><text x="348.8" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">GitHub 身份</text><text x="348.8" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">投稿版本</text><text x="348.8" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">是否同意公开</text><rect x="617.6" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="617.6" y="140" width="264.8" height="5" fill="#247d7c" /><text x="635.6" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">维护者评审</text><text x="635.6" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">请求补充或暂不采纳</text><text x="635.6" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">批准讨论：复制快照</text><text x="635.6" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">不改写投稿者原文</text><rect x="904.4000000000001" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="904.4000000000001" y="140" width="264.8" height="5" fill="#a47d29" /><text x="922.4000000000001" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">读者看到讨论</text><text x="922.4000000000001" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">用户名与公开内容</text><text x="922.4000000000001" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">原文位置与回复</text><text x="922.4000000000001" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">修改后仍需重新评审</text><rect x="1191.2" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="1191.2" y="140" width="264.8" height="5" fill="#247d7c" /><text x="1209.2" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">正文另行修订</text><text x="1209.2" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">编辑形成正文差异</text><text x="1209.2" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">黄佳批准后提交 PR</text><text x="1209.2" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">发布后关联变更记录</text><text x="44" y="494" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">批准公开讨论，不会自动改变白皮书、蓝皮书或模式定义。</text><text x="44" y="524" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">投稿撤回公开许可时，原讨论与关联回复一并隐藏。</text></svg>