<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img"><title>Public discussion and article revision are separate approvals</title><rect width="1500" height="560" fill="#fff" /><text x="44" y="62" fill="#18394a" font-size="32" font-weight="600" font-family="Arial, PingFang SC, sans-serif">Public discussion and article revision are separate approvals</text><text x="44" y="99" fill="#526b75" font-size="17" font-weight="400" font-family="Arial, PingFang SC, sans-serif">ADPS  /  DESIGN EXAMPLE</text><rect x="44.0" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="44.0" y="140" width="264.8" height="5" fill="#247d7c" /><text x="62.0" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">Quote the</text><text x="62.0" y="216" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">source</text><text x="62.0" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Passage + revision</text><text x="62.0" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Selected quotation</text><text x="62.0" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Keep the original context</text><rect x="330.8" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="330.8" y="140" width="264.8" height="5" fill="#a47d29" /><text x="348.8" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">Submit a</text><text x="348.8" y="216" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">suggestion</text><text x="348.8" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">GitHub identity</text><text x="348.8" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Submission revision</text><text x="348.8" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Consent to publication</text><rect x="617.6" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="617.6" y="140" width="264.8" height="5" fill="#247d7c" /><text x="635.6" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">Editor</text><text x="635.6" y="216" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">review</text><text x="635.6" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Request details or decline</text><text x="635.6" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Approve a public snapshot</text><text x="635.6" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Preserve author wording</text><rect x="904.4000000000001" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="904.4000000000001" y="140" width="264.8" height="5" fill="#a47d29" /><text x="922.4000000000001" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">Public</text><text x="922.4000000000001" y="216" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">discussion</text><text x="922.4000000000001" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Username + approved text</text><text x="922.4000000000001" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Source link + replies</text><text x="922.4000000000001" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Re-review edited content</text><rect x="1191.2" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="1191.2" y="140" width="264.8" height="5" fill="#247d7c" /><text x="1209.2" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">Article</text><text x="1209.2" y="216" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">revision</text><text x="1209.2" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Prepare an article diff</text><text x="1209.2" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Jia approves the PR</text><text x="1209.2" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Link the published change</text><text x="44" y="494" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Approving a discussion does not automatically change the article or pattern definition.</text><text x="44" y="524" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Withdrawing consent hides the discussion and its replies.</text></svg>