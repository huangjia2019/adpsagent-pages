<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img"><title>既有业务系统的外部扩展</title><rect width="1500" height="560" fill="#fff" /><text x="44" y="62" fill="#18394a" font-size="32" font-weight="600" font-family="Arial, PingFang SC, sans-serif">既有业务系统的外部扩展</text><text x="44" y="99" fill="#526b75" font-size="17" font-weight="400" font-family="Arial, PingFang SC, sans-serif">ADPS  /  设计示例</text><rect x="44.0" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="44.0" y="140" width="264.8" height="5" fill="#247d7c" /><text x="62.0" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">员工提出要求</text><text x="62.0" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">现有登录身份</text><text x="62.0" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">订单范围与岗位权限</text><text x="62.0" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">具体的处理意图</text><text x="312.8" y="309" fill="#247d7c" font-size="19" font-weight="400" font-family="Arial, PingFang SC, sans-serif">&gt;</text><rect x="330.8" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="330.8" y="140" width="264.8" height="5" fill="#a47d29" /><text x="348.8" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">Agent 形成草案</text><text x="348.8" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">只读查询</text><text x="348.8" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">拟操作与引用依据</text><text x="348.8" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">草案版本及内容摘要</text><text x="599.6" y="309" fill="#247d7c" font-size="19" font-weight="400" font-family="Arial, PingFang SC, sans-serif">&gt;</text><rect x="617.6" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="617.6" y="140" width="264.8" height="5" fill="#247d7c" /><text x="635.6" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">员工确认版本</text><text x="635.6" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">确认当前草案</text><text x="635.6" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">修改后重新审批</text><text x="635.6" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">保留批准记录</text><text x="886.4000000000001" y="309" fill="#247d7c" font-size="19" font-weight="400" font-family="Arial, PingFang SC, sans-serif">&gt;</text><rect x="904.4000000000001" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="904.4000000000001" y="140" width="264.8" height="5" fill="#a47d29" /><text x="922.4000000000001" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">适配器执行</text><text x="922.4000000000001" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">复查身份与业务状态</text><text x="922.4000000000001" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">校验版本与幂等键</text><text x="922.4000000000001" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">调用允许的业务命令</text><text x="1173.2" y="309" fill="#247d7c" font-size="19" font-weight="400" font-family="Arial, PingFang SC, sans-serif">&gt;</text><rect x="1191.2" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="1191.2" y="140" width="264.8" height="5" fill="#247d7c" /><text x="1209.2" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">业务系统回执</text><text x="1209.2" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">保存最终业务事实</text><text x="1209.2" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">返回业务单号</text><text x="1209.2" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">超时后查询执行结果</text><text x="44" y="494" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">示例任务：查询售后记录，准备补发申请，经批准后执行。</text><text x="44" y="524" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">原系统需要提供可用接口；最终写入端必须实际执行权限、并发和幂等约束。</text></svg>