<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img"><title>One requirement: contributions and review on an existing site</title><rect width="1500" height="560" fill="#fff" /><text x="44" y="62" fill="#18394a" font-size="32" font-weight="600" font-family="Arial, PingFang SC, sans-serif">One requirement: contributions and review on an existing site</text><text x="44" y="99" fill="#526b75" font-size="17" font-weight="400" font-family="Arial, PingFang SC, sans-serif">ADPS  /  DESIGN EXAMPLE</text><rect x="44.0" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="44.0" y="140" width="264.8" height="5" fill="#247d7c" /><text x="62.0" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">Custom</text><text x="62.0" y="216" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">application</text><text x="62.0" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Extend the site repo</text><text x="62.0" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Add UI and endpoints</text><text x="62.0" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Own the review rules</text><rect x="330.8" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="330.8" y="140" width="264.8" height="5" fill="#a47d29" /><text x="348.8" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">AI app</text><text x="348.8" y="216" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">platform</text><text x="348.8" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Generate the interface</text><text x="348.8" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Check data and identity</text><text x="348.8" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Verify deployment</text><rect x="617.6" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="617.6" y="140" width="264.8" height="5" fill="#247d7c" /><text x="635.6" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">Low-code</text><text x="635.6" y="216" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">tools</text><text x="635.6" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Forms and review tables</text><text x="635.6" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Separate private drafts</text><text x="635.6" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Link to source passages</text><rect x="904.4000000000001" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="904.4000000000001" y="140" width="264.8" height="5" fill="#a47d29" /><text x="922.4000000000001" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">Work platform</text><text x="922.4000000000001" y="216" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">extension</text><text x="922.4000000000001" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Reuse team data</text><text x="922.4000000000001" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Add a reader interface</text><text x="922.4000000000001" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Protect internal records</text><rect x="1191.2" y="140" width="264.8" height="307" rx="4" fill="#f6f9f9" stroke="#cad9dc" /><rect x="1191.2" y="140" width="264.8" height="5" fill="#247d7c" /><text x="1209.2" y="185" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">Specialized</text><text x="1209.2" y="216" fill="#18394a" font-size="25" font-weight="600" font-family="Arial, PingFang SC, sans-serif">product</text><text x="1209.2" y="250" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Use built-in discussion</text><text x="1209.2" y="287" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Check review granularity</text><text x="1209.2" y="324" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">Verify export and links</text><text x="44" y="494" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">All five need source revisions, contributor identity, publication consent and article approval.</text><text x="44" y="524" fill="#526b75" font-size="21" font-weight="400" font-family="Arial, PingFang SC, sans-serif">These options can be combined; interface generation is only part of the choice.</text></svg>